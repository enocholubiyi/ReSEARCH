<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./vars.css">
  <link rel="stylesheet" href="./login.css">
  
  
  <style>
   a,
   button,
   input,
   select,
   h1,
   h2,
   h3,
   h4,
   h5,
   * {
       box-sizing: border-box;
       margin: 0;
       padding: 0;
       border: none;
       text-decoration: none;
       background: none;
   
       -webkit-font-smoothing: antialiased;
   }
   
   menu, ol, ul {
       list-style-type: none;
       margin: 0;
       padding: 0;
   }
   </style>
  <title>Document</title>
</head>
<body>
  <div class="research-opportunities-site-login">
    <div class="main-content">
      <div class="section">
        <img
          class="re-search-website-design-1-removebg-preview-1"
          src="re-search-website-design-1-removebg-preview-10.png"
        />
        <div class="placeholder-for-container"></div>
        <div class="container"></div>
        <div class="container2"></div>
        <div class="container3">
          <div class="paragraph"></div>
          <div class="heading-1">
            <div class="find-the-people-and-places-that-move-your-ideas-fo">
              Find the perfect place for your research project
            </div>
          </div>
          <div class="paragraph-margin">
            <div class="explore-nearby-institutions-discover-potential-me">
              Discover potential mentors and facilities for your very own research
              project
            </div>
          </div>
        </div>
      </div>
      <div class="section2">
        <div class="container4">
          <div class="container-margin">
            <div class="container5">
              <img class="icon" src="icon0.svg" />
            </div>
          </div>
          <div class="heading-2">
            <div class="log-in">Log In</div>
          </div>
          <div class="paragraph2">
            <div class="welcome-back-to-your-research-workspace">
              Welcome back to your research workspace.
            </div>
          </div>
          <div class="auth-form">
            <div class="label">
              <div class="email-address">Email address</div>
              <div class="email-input">
                <div class="you-example-edu">you@example.edu</div>
              </div>
            </div>
            <div class="label-margin">
              <div class="label">
                <div class="password">Password</div>
                <div class="password-input">
                  <div class="your-password">Your password</div>
                </div>
              </div>
            </div>
            <div class="container6">
              <div class="button">
                <div class="log-in2">Log In</div>
              </div>
            </div>
            <div class="paragraph3">
              <div class="new-to-re-search-create-an-account">
                <span>
                  <span class="new-to-re-search-create-an-account-span">
                    New to ReSEARCH?
                  </span>
                  <span class="new-to-re-search-create-an-account-span2">
                    Create an account
                  </span>
                </span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  
</body>
</html>
