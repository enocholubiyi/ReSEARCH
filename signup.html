<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReSEARCH - Sign Up</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background-color: #6ea4e0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      position: relative;
      overflow-x: hidden;
    }

    /* Large background decorative letter 'C' */
    .bg-shape {
      position: absolute;
      top: 2%;
      left: 28%;
      font-size: 26rem;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.15);
      user-select: none;
      pointer-events: none;
      line-height: 1;
    }

    /* Main Flex Layout Container */
    .container {
      width: 100%;
      max-width: 1050px;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      gap: 3rem;
      z-index: 1;
    }

    /* Left Branding Section */
    .brand-section {
      flex: 1;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      max-width: 480px;
    }

    /* --- UPDATED MAGNIFYING GLASS LOGO STYLING --- */
    .logo {
      display: flex;
      align-items: center;
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 1.5rem;
      position: relative;
    }

    .magnifier-wrapper {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 68px;
      height: 68px;
    }

    .magnifier-svg {
      position: absolute;
      top: -8px;
      left: -10px;
      width: 125px;
      height: 90px;
      overflow: visible;
      z-index: 1;
      pointer-events: none;
    }

    .logo-re {
      position: relative;
      z-index: 2;
      color: #0b1c2d; /* Dark text inside the magnifying lens */
      font-size: 2.1rem;
      font-weight: 800;
    }

    .logo-search {
      color: #ffffff;
      font-size: 2.5rem;
      font-weight: 800;
      margin-left: 2px;
      z-index: 2;
    }
    /* --------------------------------------------- */

    .tagline {
      text-transform: uppercase;
      font-size: 0.8rem;
      letter-spacing: 1.5px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.85);
    }

    .hero-heading {
      font-size: 2.75rem;
      line-height: 1.15;
      font-weight: 800;
      color: #ffffff;
    }

    .hero-description {
      font-size: 1rem;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.9);
      font-weight: 400;
    }

    /* Right Form Card Section */
    .form-wrapper {
      flex: 1;
      max-width: 440px;
      display: flex;
      justify-content: center;
    }

    .card {
      background: #ffffff;
      width: 100%;
      border-radius: 24px;
      padding: 2.5rem 2rem;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
      border: 5px solid #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .avatar-icon {
      width: 56px;
      height: 56px;
      background-color: #e3effd;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
      color: #2b70c9;
    }

    .card-title {
      font-size: 1.75rem;
      font-weight: 700;
      color: #111827;
      margin-bottom: 0.25rem;
    }

    .card-subtitle {
      font-size: 0.875rem;
      color: #6b7280;
      margin-bottom: 1.5rem;
    }

    .signup-form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .form-label {
      font-size: 0.825rem;
      font-weight: 600;
      color: #374151;
    }

    .form-input {
      width: 100%;
      padding: 0.7rem 0.9rem;
      border: 1.5px solid #8ab4f8;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
    }

    .radio-group-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
    }

    .radio-options {
      display: flex;
      width: 100%;
      gap: 0.75rem;
    }

    .radio-option {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.65rem 0.85rem;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.875rem;
      color: #374151;
      font-weight: 500;
    }

    .submit-btn {
      width: 100%;
      padding: 0.8rem;
      background-color: #245ca6;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 0.925rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.4rem;
    }

    .login-link {
      margin-top: 1.25rem;
      font-size: 0.825rem;
      color: #6b7280;
      text-align: center;
    }

    .login-link a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
    }

    @media (max-width: 820px) {
      .container {
        flex-direction: column;
        align-items: center;
      }

      .brand-section {
        text-align: center;
        align-items: center;
      }
    }
  </style>
</head>
<body>

  <!-- Decorative Background 'C' -->
  <div class="bg-shape">C</div>

  <div class="container">
    <!-- Left Hero Section -->
    <div class="brand-section">
      
      <!-- RECODED MAGNIFYING GLASS LOGO -->
      <div class="logo">
        <div class="magnifier-wrapper">
          <svg class="magnifier-svg" viewBox="0 0 130 90" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Glass Circle Lens -->
            <circle cx="40" cy="40" r="32" fill="#b9d7f5" stroke="#7e9bb4" stroke-width="4"/>
            <!-- Inner Glass Reflection Highlight -->
            <path d="M 18 36 A 22 22 0 0 1 40 18" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
            <!-- Magnifier Handle -->
            <rect x="66" y="53" width="45" height="14" rx="7" transform="rotate(20 62 50)" fill="#1c2d3d"/>
          </svg>
          <span class="logo-re">Re</span>
        </div>
        <span class="logo-search">SEARCH</span>
      </div>

      <p class="tagline">Research starts with a connection</p>
      
      <h1 class="hero-heading">Find the people and places that move your ideas forward.</h1>
      
      <p class="hero-description">
        Explore nearby institutions, discover potential mentors, and write a thoughtful first message.
      </p>
    </div>

    <!-- Right Form Card -->
    <div class="form-wrapper">
      <div class="card">
        <div class="avatar-icon">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="8.5" cy="7" r="4"></circle>
            <line x1="20" y1="8" x2="20" y2="14"></line>
            <line x1="23" y1="11" x2="17" y2="11"></line>
          </svg>
        </div>

        <h2 class="card-title">Sign Up</h2>
        <p class="card-subtitle">Build your personal research network.</p>

        <form class="signup-form" action="#" method="POST" onsubmit="event.preventDefault();">
          <div class="form-group">
            <label class="form-label" for="name">Your name</label>
            <input type="text" id="name" class="form-input" placeholder="Alex Morgan">
          </div>

          <div class="radio-group-container">
            <label class="form-label">I am a</label>
            <div class="radio-options">
              <label class="radio-option">
                <input type="radio" name="role" value="student">
                Student
              </label>
              <label class="radio-option">
                <input type="radio" name="role" value="professional">
                Professional
              </label>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="email">Email address</label>
            <input type="email" id="email" class="form-input" placeholder="you@example.edu">
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" class="form-input" placeholder="At least 8 characters">
          </div>

          <button type="submit" class="submit-btn">Create Your Account</button>
        </form>

        <p class="login-link">
          Already have an account? <a href="#">Log in</a>
        </p>
      </div>
    </div>
  </div>

</body>
</html>
